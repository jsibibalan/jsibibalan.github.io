<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Block diagram: environment and automation act on a human driver whose hidden states are inferred by a driver state estimator, which feeds back to the automation"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#62666d"/></marker></defs><rect width="1000" height="470" rx="14" fill="#fbfaf7" stroke="#d9d6cf"/><text x="500" y="38" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >Human-aware automated driving</text><rect x="30" y="70" width="150" height="56" rx="10" fill="#fff" stroke="#1d1d1f" stroke-width="1.8"/><text x="105" y="94" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >Environment</text><text x="105" y="113" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#62666d" font-weight="normal" text-anchor="middle" >road, weather, hazards</text><rect x="30" y="180" width="170" height="112" rx="10" fill="#fff" stroke="#1d1d1f" stroke-width="1.8"/><text x="115" y="202" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >Automation</text><rect x="68" y="244" width="94" height="22" rx="8" fill="#1d1d1f"/><polygon points="86,244 100,222 138,222 152,244" fill="#1d1d1f"/><polygon points="94,242 103,227 114,227 114,242" fill="#fff"/><polygon points="118,242 118,227 134,227 143,242" fill="#fff"/><circle cx="90" cy="268" r="9" fill="#1d1d1f" stroke="#fff" stroke-width="2"/><circle cx="140" cy="268" r="9" fill="#1d1d1f" stroke="#fff" stroke-width="2"/><rect x="340" y="70" width="170" height="90" rx="10" fill="#fff" stroke="#1d1d1f" stroke-width="1.8"/><text x="425" y="102" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >Human driver</text><text x="425" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#62666d" font-weight="normal" text-anchor="middle" >unmeasured internal states</text><rect x="325" y="172" width="200" height="50" rx="10" fill="#eceae4" stroke="#b9b6ae" stroke-width="1.4"/><text x="425" y="192" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >Trust · Workload</text><text x="425" y="210" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="middle" >Risk perception</text><path d="M425,160 V170" fill="none" stroke="#62666d" stroke-width="1.8"/><rect x="560" y="300" width="200" height="92" rx="10" fill="#f6ecee" stroke="#8a1c2b" stroke-width="2.2"/><text x="660" y="340" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >Driver state</text><text x="660" y="362" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1d1d1f" font-weight="bold" text-anchor="middle" >estimator</text><path d="M180,98 H338" fill="none" stroke="#62666d" stroke-width="1.8" marker-end="url(#a)"/><path d="M230,98 V345 H558" fill="none" stroke="#62666d" stroke-width="1.8" marker-end="url(#a)"/><circle cx="230" cy="98" r="3.5" fill="#62666d"/><path d="M200,236 H290 V122 H338" fill="none" stroke="#62666d" stroke-width="1.8" marker-end="url(#a)"/><path d="M290,236 V378 H558" fill="none" stroke="#62666d" stroke-width="1.8" marker-end="url(#a)"/><circle cx="290" cy="236" r="3.5" fill="#62666d"/><path d="M510,100 H640" fill="none" stroke="#62666d" stroke-width="1.8" marker-end="url(#a)"/><text x="650" y="105" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" >Reliance (Auto ON/OFF)</text><path d="M525,197 H640 V298" fill="none" stroke="#62666d" stroke-width="1.8" marker-end="url(#a)"/><text x="582" y="188" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#62666d" font-weight="normal" text-anchor="middle" >Self-reports</text><path d="M510,140 H715 V298" fill="none" stroke="#62666d" stroke-width="1.8" marker-end="url(#a)"/><text x="727" y="190" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" >Behavioral and</text><text x="727" y="208" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" >physiological</text><text x="727" y="226" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" >measurements</text><path d="M760,346 H805" fill="none" stroke="#62666d" stroke-width="1.8" marker-end="url(#a)"/><text x="815" y="322" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="bold" text-anchor="start" text-decoration="underline">Estimates</text><text x="815" y="344" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" >Trust</text><text x="815" y="364" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" >Workload</text><text x="815" y="384" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" >Perceived risk</text><path d="M870,396 V438 H115 V294" fill="none" stroke="#62666d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="500" y="430" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#62666d" font-weight="normal" text-anchor="middle" >estimates inform how the automation behaves</text></svg>