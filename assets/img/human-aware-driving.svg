<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Loop: human driver, behavior, measurements, set-based estimator, vehicle adaptation"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#62666d"/></marker></defs><rect width="1000" height="380" rx="14" fill="#fbfaf7" stroke="#d9d6cf"/><text x="500" y="50" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1d1d1f" font-weight="bold" text-anchor="middle">Human-aware automated driving</text><rect x="30" y="130" width="160" height="90" rx="10" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/><text x="110.0" y="171.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="middle">Human driver</text><text x="110.0" y="193.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#62666d" font-weight="normal" text-anchor="middle">hidden: trust, workload</text><rect x="225" y="130" width="160" height="90" rx="10" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/><text x="305.0" y="171.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="middle">Reliance behavior</text><text x="305.0" y="193.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#62666d" font-weight="normal" text-anchor="middle">use automation or not</text><rect x="420" y="130" width="160" height="90" rx="10" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/><text x="500.0" y="171.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="middle">Measurements</text><text x="500.0" y="193.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#62666d" font-weight="normal" text-anchor="middle">physiology, gaze, prompts</text><rect x="615" y="130" width="160" height="90" rx="10" fill="#fff" stroke="#8a1c2b" stroke-width="1.6"/><t